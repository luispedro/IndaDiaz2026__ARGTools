[workspace]
authors = ["indajuan <indajuan@users.noreply.github.com>"]
channels = ["bioconda", "conda-forge"]
name = "arg-compare-short-reads"
description = "fargene / rgi / deeparg environments for the short-reads ARG comparison pipeline"
platforms = ["linux-64"]
version = "0.1.0"

[feature.fargene.dependencies]
python = ">=3.7"
numpy = "*"
matplotlib = "*"
hmmer = "3.4.*"
emboss = "6.6.*"
seqtk = "*"
spades = "*"
trim-galore = "*"
prodigal = "*"

[feature.fargene.pypi-dependencies]
fargene = { git = "https://github.com/indajuan/fargene.git", rev = "3be196d91d622c3a16f47d0c6a70011cc78901c6" }

[feature.rgi]
channels = ["conda-forge", "bioconda"]

[feature.rgi.dependencies]
rgi = "6.0.3.*"

[feature.deeparg.dependencies]
python = ">=3.9,<3.12"
diamond = "2.1.24.*"
trimmomatic = "*"
vsearch = "*"
pip = "*"

[feature.deeparg.pypi-dependencies]
deeparg-modern = { git = "https://github.com/gaarangoa/deeparg.git", tag = "v2.0.0" }

[feature.deeparg.tasks]
# One-time DB download -- needs to run in *this* environment (huggingface_hub
# comes from deeparg-modern's deps), never under the jug environment below.
# jugfile.py's prepare_deeparg_db task runs this same script the same way, so
# `pixi run jug-execute` covers the download; this task is for staging the
# bundle by hand (e.g. on a login node before a batch run).
download-deeparg-db = "python download_deeparg_db.py"

[feature.ngless]
channels = ["conda-forge", "bioconda"]

[feature.ngless.dependencies]
# Runs preprocess.ngl to quality-trim each sample's reads into the scratch
# directory that the tool then runs in (see jugfile.py). 1.6 is what the
# `ngless "1.6"` header in preprocess.ngl requires.
ngless = "1.6.*"

[feature.jug]
channels = ["conda-forge"]

[feature.jug.dependencies]
python = ">=3.10"
jug = "*"

[feature.jug.tasks]
# jugfile.py orchestrates ngless/fargene/rgi/deeparg by shelling out to each
# one's own pixi environment (`pixi run -e <env> ...`) -- it never imports
# their packages directly, so this environment only needs jug itself. They
# are deliberately *not* exposed as pixi tasks: tasks always run from the
# workspace root, while every tool here runs from a per-invocation scratch
# directory (`rgi ... --local`, in particular, resolves localDB/ from its cwd).
# --keep-going: one sample/tool failing (e.g. a missing localDB) must not
# stop unrelated, independent tasks from running; --keep-failed is
# deliberately omitted so a fixed prerequisite gets retried on the next run
# instead of staying locked as permanently failed.
jug-execute = "jug execute jugfile.py --keep-going"
jug-status = "jug status jugfile.py"

[environments]
fargene = { features = ["fargene"], no-default-feature = true }
rgi = { features = ["rgi"], no-default-feature = true }
deeparg = { features = ["deeparg"], no-default-feature = true }
ngless = { features = ["ngless"], no-default-feature = true }
jug = { features = ["jug"], no-default-feature = true }

# Usage:
#   pixi install
#   Edit config.py (samples + shared settings), then:
#   pixi run jug-status                  # what's done / pending
#   pixi run jug-execute                 # run everything config.py asks for
# jugfile.py is safe to re-run: jug skips work it already finished. The
# one-time database setup (CARD localDB, DeepARG model bundle) is part of the
# graph, so jug-execute does it on the first run; to stage the DeepARG bundle
# ahead of time instead, run `pixi run download-deeparg-db <DEEPARG_HF_DIR>`.
